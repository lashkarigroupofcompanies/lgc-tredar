name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.12.0)'
        required: false
        default: 'v2.12.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Package Windows Standalone App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Frontend Assets
        shell: bash
        run: |
          cd ui
          npm install --legacy-peer-deps
          npx vite build --config vite.lgc.config.ts
          cd ..

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm LGCTrader.spec

      - name: Archive Executable as ZIP (For Safe Windows Distribution)
        run: |
          Compress-Archive -Path dist/LGCTrader.exe -DestinationPath dist/LGCTrader-Windows-x64.zip

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload Executable
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: LGC Trader ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LGCTrader.exe
            dist/LGCTrader-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
